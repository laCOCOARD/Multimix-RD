{# Fila de productos que se desliza: con el dedo, la rueda o las flechas. Sin JavaScript sigue deslizandose. #}
{# Recibe `productos`; `auto` hace que avance solo (se detiene al pasar el raton o tocarla). #}
<div class="mm-fila" data-fila{% if auto %} data-auto{% endif %}>
  <button class="mm-fila-flecha mm-fila-anterior" type="button" data-mover="-1" aria-label="Ver anteriores" hidden>
    <i class="bi bi-chevron-left"></i>
  </button>
  <div class="mm-fila-pista" tabindex="0">
    {% for producto in productos %}
      <div class="mm-fila-item">{% include 'includes/tarjeta_producto.html' %}</div>
    {% endfor %}
  </div>
  <button class="mm-fila-flecha mm-fila-siguiente" type="button" data-mover="1" aria-label="Ver más" hidden>
    <i class="bi bi-chevron-right"></i>
  </button>
</div>
