{% extends 'base.html' %}

{% block titulo %}{{ titulo }} · {{ plataforma.nombre }}{% endblock %}
{% block meta %}<meta name="robots" content="noindex">{% endblock %}

{% block contenido %}
<div class="container py-4">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-5">
      <div class="mm-panel text-center">
        <i class="bi bi-envelope-check mm-icono-estado text-success"></i>
        <h1 class="h3 mt-2">{{ titulo }}</h1>
        <p class="text-muted">{{ texto }}</p>
        {% if enlace %}<a class="btn btn-primary" href="{% url enlace.0 %}">{{ enlace.1 }}</a>{% endif %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
